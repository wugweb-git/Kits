name: Kits Suite CI/CD

on:
  push:
    branches: [main, kits-suite]
  pull_request:
    branches: [main, kits-suite]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      root_ds: ${{ steps.filter.outputs.root_ds }}
      theme: ${{ steps.filter.outputs.theme }}
      shared_php: ${{ steps.filter.outputs.shared_php }}
      kits_core: ${{ steps.filter.outputs.kits_core }}
      directoryweb: ${{ steps.filter.outputs.directoryweb }}
      insightweb: ${{ steps.filter.outputs.insightweb }}
      rankweb: ${{ steps.filter.outputs.rankweb }}
      mailweb: ${{ steps.filter.outputs.mailweb }}
      planweb: ${{ steps.filter.outputs.planweb }}
      sourceweb: ${{ steps.filter.outputs.sourceweb }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            root_ds:
              - 'package.json'
              - 'package-lock.json'
              - 'src/**'
              - 'design-system/**'
              - 'scripts/**'
              - 'vite.config.ts'
            theme:
              - 'themes/kits-by-wugweb/**'
            shared_php:
              - 'packages/shared-php/**'
            kits_core:
              - 'plugins/kits-core/**'
              - 'packages/shared-php/**'
            directoryweb:
              - 'plugins/directoryweb/**'
              - 'packages/shared-php/**'
            insightweb:
              - 'plugins/insightweb/**'
            rankweb:
              - 'plugins/rankweb/**'
            mailweb:
              - 'plugins/mailweb/**'
            planweb:
              - 'plugins/planweb/**'
            sourceweb:
              - 'plugins/sourceweb/**'
              - 'plugins/directoryweb/**'
              - 'plugins/insightweb/**'
            packaging:
              - 'tools/build/**'
              - 'tools/package/**'
              - 'themes/**'
              - 'plugins/**'

  ci-design-system:
    name: Root & Design System Gates
    needs: changes
    if: ${{ needs.changes.outputs.root_ds == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run check:ci
      - run: npm run test:visual

  ci-shared-php:
    name: Shared PHP SDK (${{ matrix.php }})
    needs: changes
    if: ${{ needs.changes.outputs.shared_php == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Run TokenEngine & SDK Tests
        run: |
          cd packages/shared-php
          php tests/TokenEngineTest.php

  ci-theme:
    name: Kits Block Theme Validation
    needs: changes
    if: ${{ needs.changes.outputs.theme == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate theme.json and Token Compiler
        run: |
          python3 -c "import json; json.load(open('themes/kits-by-wugweb/theme.json'))"
          python3 themes/kits-by-wugweb/tools/build-tokens.py --help

  ci-plugins:
    name: Companion Plugins Test Suite
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Test Kits Core
        if: ${{ needs.changes.outputs.kits_core == 'true' || github.event_name == 'push' }}
        run: |
          for f in plugins/kits-core/tests/*-tests.php; do
            echo "Running $f"
            php "$f"
          done

      - name: Test DirectoryWeb
        if: ${{ needs.changes.outputs.directoryweb == 'true' || github.event_name == 'push' }}
        run: |
          php plugins/directoryweb/tests/directoryweb-tests.php
          php plugins/directoryweb/tests/listing-meta-tests.php
          php plugins/directoryweb/tests/org-people-tests.php

      - name: Test InsightWeb
        if: ${{ needs.changes.outputs.insightweb == 'true' || github.event_name == 'push' }}
        run: |
          php plugins/insightweb/tests/run.php

      - name: Test RankWeb
        if: ${{ needs.changes.outputs.rankweb == 'true' || github.event_name == 'push' }}
        run: |
          php plugins/rankweb/tests/run.php

      - name: Test MailWeb
        if: ${{ needs.changes.outputs.mailweb == 'true' || github.event_name == 'push' }}
        run: |
          php plugins/mailweb/tests/run.php

      - name: Test PlanWeb
        if: ${{ needs.changes.outputs.planweb == 'true' || github.event_name == 'push' }}
        run: |
          php plugins/planweb/tests/run.php

      - name: Test SourceWeb
        if: ${{ needs.changes.outputs.sourceweb == 'true' || github.event_name == 'push' }}
        run: |
          php plugins/sourceweb/tests/run.php

  package-dist:
    name: Package Distribution Artifacts
    needs: [changes, ci-theme, ci-plugins]
    if: ${{ always() && (needs.changes.outputs.packaging == 'true' || github.event_name == 'push') && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Distribution Packages
        run: |
          python3 tools/build/build-dist.py --target all --track commercial --out dist
      - name: Upload Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kits-suite-packages
          path: dist/*.zip
          retention-days: 14
