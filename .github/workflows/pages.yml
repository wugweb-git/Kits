name: Product pages and registry

# Publishes https://wugweb-git.github.io/Kits/ : one page per product (the address each Plugin URI points to) and the
# registry manifest at /registry/index.json. Built from the product files and the GitHub releases by
# tools/release/build-site.py. Runs on every push to the default branch, and after a product release.

on:
  push:
    branches: [kits-suite]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build pages and registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/release/build-site.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
