name: Kits Suite Release

# Manual, commit-pinned release. Builds the eight products from the checked-out commit, refuses to run unless
# the commit's "Kits Suite CI/CD" run succeeded, verifies the packages, and publishes a GitHub release with
# all eight ZIPs, SHA256SUMS and release-manifest.json. Product versions are read from product headers.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match RELEASE_TAG in tools/playground/build-blueprints.py for blueprint URLs)'
        required: true
        default: 'kits-suite-2026.11.24-pre.1'
      prerelease:
        description: 'Publish as a prerelease'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Working tree is clean and the tag matches the blueprints
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          printf '%s' "$TAG" | grep -Eq '^kits-suite-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-pre\.[0-9]+)?$' || { echo "Tag must look like kits-suite-YYYY.MM.DD or kits-suite-YYYY.MM.DD-pre.N"; exit 1; }
          if printf '%s' "$TAG" | grep -q -- '-pre' && [ "$PRERELEASE" != "true" ]; then echo "A -pre tag must be a prerelease."; exit 1; fi
          test -z "$(git status --porcelain)"
          grep -qF "RELEASE_TAG = \"$TAG\"" tools/playground/build-blueprints.py
          python3 tools/playground/build-blueprints.py --check

      - name: Require a successful CI run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/actions/workflows/ci-suite.yml/runs?head_sha=${{ github.sha }}" \
            --jq '[.workflow_runs[] | select(.event=="push" and .status=="completed")] | sort_by(.created_at) | last | .conclusion')
          echo "CI conclusion for ${{ github.sha }}: ${conclusion}"
          test "${conclusion}" = "success"

      - name: Build and verify packages
        run: |
          python3 tools/build/build-dist.py --target all --track commercial --out dist
          python3 tools/build/verify-dist.py --dist dist --commit "${{ github.sha }}"

      - name: Write release notes
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open('dist/release-manifest.json'))
          rows = "\n".join(f"| {p['product']} | {p['version']} | `{p['artifact']}` | {p['size_bytes']} | `{p['sha256']}` |" for p in m['products'])
          open('dist/NOTES.md', 'w').write(f"""Kits Suite prerelease built from commit `{m['source_commit']}`.

          | Product | Version | Artifact | Bytes | SHA-256 |
          |---|---|---|---|---|
          {rows}

          ## Install
          Upload each ZIP in Plugins > Add New > Upload Plugin (the theme in Appearance > Themes > Add New). Each product
          activates on its own; Kits Core is optional. Try them in WordPress Playground with the blueprints in `tools/playground/`.

          ## Known limitations
          - Prerelease: product versions are unchanged product headers, not a stable release.
          - MailWeb bundles the Hostinger Mail API SDK, which needs PHP 8.2+; on PHP 8.0/8.1 MailWeb uses its built-in REST transport.
          - Requires WordPress 7.1+ and PHP 8.0+.
          """.replace('\n          ', '\n'))
          PY

      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          COMMIT: ${{ github.sha }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" --draft ${flags} --target "$COMMIT" \
            --title "Kits Suite $TAG" --notes-file dist/NOTES.md \
            dist/*.zip dist/SHA256SUMS dist/release-manifest.json

      - name: Verify every draft asset downloads and matches its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p verify && cd verify
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*'
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          test -s release-manifest.json

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false
