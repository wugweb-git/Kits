name: Release one product

# One product, one version, one tag (<slug>-v<version>), one release. The version is read from the product's own header,
# so a release is cut by raising the version in the product (header, readme Stable tag, changelog) and running this.
# Refuses to run unless the commit's "Kits Suite CI/CD" run succeeded. A tag is never reused: a published version is final.
# docs/architecture/monorepo-delivery-architecture.md, 4.2; docs/deployment/registry-and-updates.md.

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Product to release'
        required: true
        type: choice
        options:
          - kits-by-wugweb
          - kits-core
          - directoryweb
          - rankweb
          - sourceweb
          - insightweb
          - mailweb
          - planweb
      prerelease:
        description: 'Publish as a prerelease'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Release ${{ inputs.product }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Working tree is clean and versions agree
        run: |
          test -z "$(git status --porcelain)"
          python3 tools/validate/check-versions.py
          python3 tools/validate/check-held-code.py

      - name: Require a successful CI run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/actions/workflows/ci-suite.yml/runs?head_sha=${{ github.sha }}" \
            --jq '[.workflow_runs[] | select(.event=="push" and .status=="completed")] | sort_by(.created_at) | last | .conclusion')
          echo "CI conclusion for ${{ github.sha }}: ${conclusion}"
          test "${conclusion}" = "success"

      - name: Build this product and verify its files
        id: build
        env:
          PRODUCT: ${{ inputs.product }}
          COMMIT: ${{ github.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          python3 tools/release/release-product.py "$PRODUCT" --out dist-release --commit "$COMMIT" | tee build.log
          tag=$(sed -n 's/^tag=//p' build.log)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          sed -n 's/^title=//p' build.log > release-title.txt
          # a stable release must have a plain x.y.z version
          if [ "$PRERELEASE" != "true" ] && ! printf '%s' "$tag" | grep -Eq -- '-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag $tag is not a plain x.y.z version, so it cannot be a stable release."; exit 1
          fi

      - name: A published version is final
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Raise the product's version to release again."
            exit 1
          fi

      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          COMMIT: ${{ github.sha }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" --draft ${flags} --target "$COMMIT" \
            --title "$(cat release-title.txt)" --notes-file dist-release/NOTES.md \
            dist-release/*.zip dist-release/SHA256SUMS dist-release/*-release.json

      - name: Verify every draft asset downloads and matches its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          mkdir -p verify && cd verify
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*'
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for z in *.zip; do unzip -tq "$z"; done

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

      - name: Refresh the product pages and registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
